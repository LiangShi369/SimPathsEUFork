# Batch scenario 2/5 — Ramsey baseline (Ramsey trend only, no counterfactual)
# Until 2026-11 this arm ran with the planner's feedback switched off.
# The feedback is now always on with a Ramsey layer, here with rho = 1, so earlier results of
# this arm are not reproduced by the same file.
countryString: "Poland"
maxNumberOfRuns: 1
executeWithGui: false
randomSeed: 42
startYear: 2023
endYear: 2060
popSize: 20000

model_args:
    alignPopulation: true
    alignRetirement: true
    alignDisability: true
    alignEducation: true
    alignInSchool: true
    alignCohabitation: true
    alignEmployment: true
    alignFertility: true

    # Macro Model
    mm_macroModel: ramsey
    # off | ramsey | dsge | ramsey_dsge   (dsge alone is diagnostic: the cycle was
    # estimated on Ramsey-detrended data, so without the trend layer it deviates
    # around SimPaths' own wage trend instead)
    mm_macroLogging: verbose          # off | state | verbose (verbose implies state)
    mm_dsgeMaxStateDeviation: 30

    mm_ramseyFeedbackPersistence: 1.0

collector_args:
    exportToCSV: true
